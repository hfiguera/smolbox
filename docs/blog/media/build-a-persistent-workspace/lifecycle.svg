<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title"><title id="title">One machine across commands and controller restarts</title><rect width="1120" height="510" fill="#fbfcfe"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="62" fill="#17304e" font-size="36" font-weight="700">Commands finish. The machine stays.</text><rect x="40" y="115" width="185" height="92" rx="8" fill="#edf2fa"/><text x="54" y="150" fill="#17304e" font-size="21" font-weight="700">Write a file</text><text x="54" y="180" fill="#526478" font-size="17" font-weight="400">Command A</text><path d="M229 160h15m-5-5 5 5-5 5" fill="none" stroke="#215bc7" stroke-width="2"/><rect x="250" y="115" width="185" height="92" rx="8" fill="#edf2fa"/><text x="264" y="150" fill="#17304e" font-size="21" font-weight="700">Read the file</text><text x="264" y="180" fill="#526478" font-size="17" font-weight="400">Command B</text><path d="M439 160h15m-5-5 5 5-5 5" fill="none" stroke="#215bc7" stroke-width="2"/><rect x="460" y="115" width="185" height="92" rx="8" fill="#edf2fa"/><text x="474" y="150" fill="#17304e" font-size="21" font-weight="700">Restart Phoenix</text><text x="474" y="180" fill="#526478" font-size="17" font-weight="400">Controller only</text><path d="M649 160h15m-5-5 5 5-5 5" fill="none" stroke="#215bc7" stroke-width="2"/><rect x="670" y="115" width="185" height="92" rx="8" fill="#edf2fa"/><text x="684" y="150" fill="#17304e" font-size="21" font-weight="700">Read it again</text><text x="684" y="180" fill="#526478" font-size="17" font-weight="400">Command C</text><rect x="40" y="245" width="815" height="118" rx="8" fill="#17304e"/><text x="65" y="285" fill="#ffffff" font-size="28" font-weight="700">Same managed machine</text><text x="65" y="325" fill="#ffffff" font-size="22" font-weight="400">Guest files stay on the worker disk.</text><path d="M880 115v248" stroke="#d8e0eb" stroke-width="2"/><text x="906" y="152" fill="#17304e" font-size="27" font-weight="700">Delete</text><text x="906" y="184" fill="#526478" font-size="17" font-weight="400">Explicit request</text><text x="906" y="280" fill="#17304e" font-size="19" font-weight="400">Verify absence</text><text x="906" y="315" fill="#17304e" font-size="19" font-weight="400">Release capacity</text><text x="40" y="420" fill="#17304e" font-size="22" font-weight="700">PostgreSQL + stable keys</text><text x="40" y="456" fill="#526478" font-size="21" font-weight="400">Recover identity, intent and outcomes. Keep history after deletion.</text></g></svg>