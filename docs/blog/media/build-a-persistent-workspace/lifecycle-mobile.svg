<svg xmlns="http://www.w3.org/2000/svg" width="390" height="690" viewBox="0 0 390 690" role="img" aria-labelledby="title"><title id="title">A retained machine outlives commands and a controller restart</title><rect width="390" height="690" fill="#fbfcfe"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="42" fill="#17304e" font-size="29" font-weight="700">Write. Run. Return.</text><text x="22" y="75" fill="#526478" font-size="21" font-weight="400">One retained machine.</text><rect x="22" y="110" width="346" height="348" rx="8" fill="#edf2fa"/><text x="42" y="144" fill="#17304e" font-size="23" font-weight="700">Write a file</text><text x="42" y="171" fill="#526478" font-size="17" font-weight="400">Command A</text><path d="M42 186h306" stroke="#d8e0eb"/><text x="42" y="223" fill="#17304e" font-size="23" font-weight="700">Read the file</text><text x="42" y="250" fill="#526478" font-size="17" font-weight="400">Command B</text><path d="M42 265h306" stroke="#d8e0eb"/><text x="42" y="302" fill="#17304e" font-size="23" font-weight="700">Restart Phoenix</text><text x="42" y="329" fill="#526478" font-size="17" font-weight="400">Controller only</text><path d="M42 344h306" stroke="#d8e0eb"/><text x="42" y="381" fill="#17304e" font-size="23" font-weight="700">Read it again</text><text x="42" y="408" fill="#526478" font-size="17" font-weight="400">Command C</text><text x="22" y="503" fill="#17304e" font-size="21" font-weight="700">Files stay on the worker disk.</text><text x="22" y="535" fill="#526478" font-size="18" font-weight="400">PostgreSQL keeps management records.</text><path d="M22 566h346" stroke="#d8e0eb"/><text x="22" y="605" fill="#17304e" font-size="20" font-weight="700">Explicit deletion ends the machine.</text><text x="22" y="637" fill="#526478" font-size="18" font-weight="400">Verify absence, then release capacity.</text><text x="22" y="667" fill="#526478" font-size="18" font-weight="400">Request history remains.</text></g></svg>