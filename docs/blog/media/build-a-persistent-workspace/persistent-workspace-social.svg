<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">Come back to the same machine with Phoenix and SmolBox 0.2.0</title><rect width="1200" height="630" fill="#fbfcfe"/><g font-family="Arial, Helvetica, sans-serif"><text x="65" y="100" fill="#17304e" font-size="56" font-weight="700">Come back to</text><text x="65" y="166" fill="#17304e" font-size="56" font-weight="700">the same machine.</text><text x="65" y="222" fill="#526478" font-size="28" font-weight="400">Phoenix + SmolBox 0.2.0</text><path d="M65 278h1070" stroke="#d8e0eb" stroke-width="2"/><text x="65" y="344" fill="#17304e" font-size="30" font-weight="700">Write</text><text x="65" y="382" fill="#526478" font-size="23" font-weight="400">Change the project</text><text x="430" y="344" fill="#17304e" font-size="30" font-weight="700">Run</text><text x="430" y="382" fill="#526478" font-size="23" font-weight="400">Keep the result</text><text x="795" y="344" fill="#17304e" font-size="30" font-weight="700">Return</text><text x="795" y="382" fill="#526478" font-size="23" font-weight="400">Restart the controller</text><rect x="65" y="428" width="1070" height="96" rx="8" fill="#17304e"/><text x="93" y="470" fill="#fff" font-size="30" font-weight="700">A persistent workspace</text><text x="93" y="504" fill="#fff" font-size="22" font-weight="400">One machine. Separate command identities. Files you can revisit.</text><text x="65" y="585" fill="#526478" font-size="22" font-weight="400">SmolBox engineering</text></g></svg>