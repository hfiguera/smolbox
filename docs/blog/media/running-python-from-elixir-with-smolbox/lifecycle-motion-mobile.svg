<svg xmlns="http://www.w3.org/2000/svg" width="390" height="630" viewBox="0 0 390 630" role="img" aria-labelledby="title desc"><title id="title">The VM goes. The result stays.</title><desc id="desc">Observe the result, collect the output, then verify VM cleanup. These are separate facts; the file remains in the artifact store.</desc><rect width="390" height="630" fill="#edf2fa"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#17304e"><text x="24" y="44" font-size="26" font-weight="700">The VM goes.</text><text x="24" y="78" font-size="26" font-weight="700">The result stays.</text><rect x="24" y="110" width="342" height="124" rx="8" fill="#fff"/><text x="42" y="144" font-size="21" font-weight="700">1. Observe the outcome</text><text x="42" y="179" font-size="16">Python exits; the result is recorded.</text><text x="42" y="206" font-size="16" fill="#526478">Collection and cleanup are pending.</text><path d="M195 236v26m-7-8 7 8 7-8" fill="none" stroke="#215bc7" stroke-width="2"/><rect x="24" y="267" width="342" height="124" rx="8" fill="#fff"/><text x="42" y="301" font-size="21" font-weight="700">2. Collect the output</text><text x="42" y="336" font-size="16">Copy the declared file to the store.</text><text x="42" y="363" font-size="16" fill="#526478">Cleanup is still pending.</text><path d="M195 393v26m-7-8 7 8 7-8" fill="none" stroke="#215bc7" stroke-width="2"/><rect x="24" y="424" width="342" height="124" rx="8" fill="#fff"/><text x="42" y="458" font-size="21" font-weight="700">3. Verify cleanup</text><text x="42" y="493" font-size="16">Confirm the VM has been removed.</text><text x="42" y="520" font-size="16" fill="#526478">The collected file remains available.</text><text x="24" y="596" font-size="15" fill="#526478">Illustrative sequence · not measured timing</text></g></svg>