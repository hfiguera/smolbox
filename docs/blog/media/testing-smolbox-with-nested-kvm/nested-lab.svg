<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Recovery at each layer</title>
  <desc id="desc">The physical Linux host runs independent recovery outside a disposable QEMU guest. The guest contains an Elixir controller and PostgreSQL, alongside a bounded SmolVM worker that runs an inner Linux microVM using nested KVM.</desc>
  <rect width="1200" height="780" fill="#edf2fa"/>
  <g font-family="sans-serif">
    <text x="52" y="62" font-size="36" font-weight="700" fill="#17304e">Recovery at each layer</text>
    <rect x="32" y="104" width="1136" height="630" rx="12" fill="#17304e"/>
    <text x="60" y="162" font-size="28" font-weight="700" fill="#fff">Physical Linux host</text>
    <rect x="602" y="128" width="538" height="58" rx="6" fill="#e2eaf6"/>
    <text x="628" y="166" font-size="25" font-weight="600" fill="#17304e">Host deadline + recovery timer</text>
    <text x="60" y="207" font-size="24" fill="#d5e3fa">QEMU budget: 12 GiB memory · 4 CPUs | Lab storage: 128 GiB</text>
    <rect x="60" y="237" width="1080" height="469" rx="8" fill="#fff"/>
    <text x="84" y="280" font-size="28" font-weight="700" fill="#17304e">Disposable QEMU guest</text>
    <text x="84" y="318" font-size="24" fill="#526478">4 vCPU · 8 GiB RAM · 100 GiB virtual disk</text>
    <rect x="84" y="350" width="380" height="329" rx="6" fill="#edf2fa" stroke="#a6b8ce"/>
    <text x="108" y="397" font-size="27" font-weight="700" fill="#17304e">Elixir controller</text>
    <text x="108" y="435" font-size="24" fill="#17304e">SmolBox + PostgreSQL</text>
    <path d="M108 459h330" stroke="#a6b8ce"/>
    <text x="108" y="501" font-size="24" fill="#526478">Execution identity</text>
    <text x="108" y="542" font-size="24" fill="#526478">Observed outcome</text>
    <text x="108" y="583" font-size="24" fill="#526478">Cleanup and capacity</text>
    <text x="108" y="649" font-size="22" fill="#17304e">Outside worker storage</text>
    <text x="485" y="479" font-size="20" fill="#526478">HTTP</text>
    <path d="M482 506h64m-10-8 10 8-10 8" fill="none" stroke="#215bc7" stroke-width="3"/>
    <rect x="568" y="350" width="548" height="329" rx="6" fill="#215bc7"/>
    <text x="592" y="397" font-size="27" font-weight="700" fill="#fff">Bounded SmolVM worker</text>
    <text x="592" y="435" font-size="24" fill="#e4edff">1.5 GiB memory · 1 CPU · 96 tasks</text>
    <rect x="592" y="467" width="500" height="188" rx="6" fill="#edf2fa"/>
    <text x="616" y="511" font-size="27" font-weight="700" fill="#17304e">Inner Linux microVM</text>
    <text x="616" y="554" font-size="24" fill="#17304e">Python / Node.js · 256 MiB</text>
    <text x="616" y="618" font-size="24" fill="#526478">Real nested KVM</text>
    <text x="52" y="765" font-size="19" fill="#526478">Conceptual layout of the recorded Linux configuration. CPU limits are bandwidth; tasks are host tasks.</text>
  </g>
</svg>
