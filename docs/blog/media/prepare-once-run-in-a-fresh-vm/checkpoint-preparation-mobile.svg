<svg xmlns="http://www.w3.org/2000/svg" width="390" height="610" viewBox="0 0 390 610" role="img" aria-labelledby="title desc">
  <title id="title">Prepare once. Restore separate VMs.</title>
  <desc id="desc">Job A edits its restored table. The approved idle, offline checkpoint and Job B keep the original table. Job C restores afterward and also receives the original table.</desc>
  <rect width="390" height="610" fill="#edf2fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#17304e">
    <text x="24" y="42" font-size="24" font-weight="700">Reuse the preparation.</text>
    <text x="24" y="73" font-size="24" font-weight="700">Keep executions separate.</text>
    <rect x="24" y="104" width="342" height="119" rx="8" fill="#17304e"/>
    <text x="44" y="139" font-size="21" font-weight="700" fill="#fff">Approved checkpoint</text>
    <text x="44" y="170" font-size="17" fill="#b9d1ff">Original table stays unchanged</text>
    <text x="44" y="200" font-size="17" fill="#fff">Idle guest · networking off</text>
    <path d="M195 224v46m-8-10 8 10 8-10" fill="none" stroke="#215bc7" stroke-width="2"/>
    <text x="195" y="303" text-anchor="middle" font-size="18">Restore for each new execution</text>
    <path d="M195 318v16M74 350v-16h242v16M195 334v16" fill="none" stroke="#215bc7" stroke-width="2"/>
    <g fill="#215bc7">
      <rect x="24" y="350" width="101" height="108" rx="6" fill="#17304e"/>
      <rect x="144" y="350" width="101" height="108" rx="6"/>
      <rect x="264" y="350" width="101" height="108" rx="6"/>
    </g>
    <g fill="#fff" font-size="21" font-weight="700" text-anchor="middle">
      <text x="74" y="389">Job A</text><text x="195" y="389">Job B</text><text x="315" y="389">Job C</text>
    </g>
    <g fill="#fff" font-size="16" text-anchor="middle">
      <text x="74" y="425">Edited</text><text x="195" y="425">Original</text><text x="315" y="425">Original</text>
    </g>
    <text x="24" y="496" font-size="18" font-weight="700">Only Job A changes its table.</text>
    <text x="24" y="526" font-size="17">Job B keeps the original. Job C restores</text>
    <text x="24" y="552" font-size="17">after the edit and starts clean, too.</text>
    <text x="24" y="583" font-size="14" fill="#526478">Conceptual lifecycle · not a timing chart</text>
  </g>
</svg>
