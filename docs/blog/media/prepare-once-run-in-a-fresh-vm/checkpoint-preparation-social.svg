<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Prepare once. Restore separately.</title>
  <desc>An approved idle checkpoint supplies prepared state to three separate disposable executions. Each keeps its own result and cleanup.</desc>
  <rect width="1200" height="630" fill="#fbfcfe"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <path d="M56 54h28v28H56z" fill="none" stroke="#215bc7" stroke-width="3"/>
    <text x="99" y="77" font-size="26" font-weight="650" fill="#17304e">SmolBox</text>
    <text x="56" y="163" font-size="19" font-weight="600" letter-spacing="2" fill="#526478">EXECUTING FROM CHECKPOINTS</text>
    <text x="52" y="245" font-size="60" font-weight="700" letter-spacing="-2" fill="#17304e">Prepare once.</text>
    <text x="52" y="319" font-size="60" font-weight="700" letter-spacing="-2" fill="#17304e">Restore separately.</text>
    <text x="56" y="390" font-size="24" fill="#526478">Keep the prepared state.</text>
    <text x="56" y="428" font-size="24" fill="#526478">Give each job its own VM.</text>
    <rect x="664" y="148" width="444" height="90" rx="8" fill="#edf2fa" stroke="#d8e0eb"/>
    <text x="886" y="185" text-anchor="middle" font-size="24" font-weight="650" fill="#17304e">Approved idle checkpoint</text>
    <text x="886" y="218" text-anchor="middle" font-size="20" fill="#526478">Prepared data in RAM</text>
    <path d="M886 239v53M718 292h336M718 292v44M886 292v44M1054 292v44" fill="none" stroke="#215bc7" stroke-width="3"/>
    <g fill="#edf2fa" stroke="#215bc7" stroke-width="2">
      <rect x="656" y="336" width="124" height="82" rx="8"/>
      <rect x="824" y="336" width="124" height="82" rx="8"/>
      <rect x="992" y="336" width="124" height="82" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="24" font-weight="650" fill="#17304e">
      <text x="718" y="386">Job A</text><text x="886" y="386">Job B</text><text x="1054" y="386">Job C</text>
    </g>
    <text x="886" y="463" text-anchor="middle" font-size="20" fill="#526478">Separate results and cleanup</text>
    <path d="M56 533h1088" stroke="#d8e0eb" stroke-width="2"/>
    <text x="56" y="577" font-size="21" fill="#526478">Elixir · smolvm 1.16.1 · SmolBox 0.1.5</text>
    <text x="920" y="577" font-size="21" fill="#215bc7">smolbox / field notes</text>
  </g>
</svg>
