[package]
name = "smolbox-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
smolvm.workspace = true
smolvm-pack.workspace = true
smolvm-registry.workspace = true
smolvm-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2 = "0.10"
crc32fast = "1"
hex = "0.4"
libc = "0.2"
getrandom = "0.3"
tempfile = "3"
tar = "0.4"
zstd = "0.13"
dirs = "5"
rusqlite = { version = "0.32", features = ["hooks"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
